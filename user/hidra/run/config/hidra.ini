# example init file: Ex0.ini
[LogCollector.log]
EULOG_GUI_LOG_FILE_PATTERN = /home/eudaq/daq/TB2026_HidraData/Logs/hidra_daq_$12D.log
LOG_LEVEL_PRINT = 0           # 0 DEBUG, 1 OK, 2 THROW etc...
LOG_LEVEL_WRITE = 0

[Producer.QTPDProducer]
EX0_DEV_LOCK_PATH = /tmp/mydev0.lock
ControllerType = V2718
#LinkOrPid = 49086
LinkOrPid = 0

# FERS2 producer settings
# Class = HidraFERS2Producer
# FERS_CONF_FILE = /home/rscaglio/work/eudaq_hidra/user/hidra/fers/misc/conf/FERSlib_Config1.txt


[Monitor.HidraHttpMonitor]
PUMP_INTERVAL_MS = 20      # Refresh rate for the monitor web server.
HTTP_PORT = 9090           # Port for the monitor web server.
EVENT_PRESCALE = 1         # Process every Nth event for monitoring. Set to 1 to process all events, >1 to reduce load.
PEDESTAL_NOISE_UPDATE_EVENTS = 200  # Recompute the per-channel pedestal noise (ADC_noise_pedestal / ADC_noise_std_pedestal) every N pedestal events. Lower = more responsive, higher = cheaper.
HISTO_OUTPUT_PATTERN = /home/eudaq/daq/TB2026_HidraData/Monitor/monitor_run$6R_$12D$X   # FileNamer pattern for the ROOT file saved at end-of-run: $R run number, $D timestamp, $X extension (.root); an optional width prefix pads, e.g. $6R, $12D. Empty to disable.
